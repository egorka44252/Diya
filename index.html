<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Connections</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="status" id="status">● DEMO</div>
    
    <h1>ACTIVE CONNECTIONS</h1>
    <div class="counter" id="counter">0</div>
    
    <div class="info">
        <div>Peak: <span id="peak">0</span></div>
        <div>Total: <span id="total">0</span></div>
        <div>Uptime: <span id="uptime">0s</span></div>
    </div>
    
    <canvas id="chart" width="700" height="180"></canvas>

    <p class="hint">Это демо-режим. Для реальных данных нужен бэкенд.</p>

    <script src="script.js"></script>
</body>
</html>
